# Logging.
[logging]

  # Log level.
  #
  # Options are: trace, debug, info, warn error.
  level="info"


# PostgreSQL configuration.
[postgresql]

  # PostgreSQL DSN.
  #
  # Format example: postgres://<USERNAME>:<PASSWORD>@<HOSTNAME>/<DATABASE>?sslmode=<SSLMODE>.
  #
  # SSL mode options:
  #  * disable - Do not use TLS
  #  * prefer - Attempt to connect with TLS but allow sessions without
  #  * require - Require the use of TLS
  dsn="postgres://chirpstack:$POSTGRES_PASSWORD@$POSTGRESQL_HOST/chirpstack?sslmode=disable"

  # Max open connections.
  max_open_connections=10

  # Min idle connections.
  min_idle_connections=0


# Redis configuration.
[redis]

  # Server address or addresses.
  servers=[
    "redis://$REDIS_HOST/",
  ]

  # TLS enabled.
  tls_enabled=false

  # Redis Cluster.
  cluster=false


# Network related configuration.
[network]

  # Network identifier (NetID, 3 bytes) encoded as HEX (e.g. 010203).
  net_id="000000"

  # REGION: this deployment uses AS923-1 (ChirpStack id "as923"), NOT AS923-2.
  # It must match in 3 places or uplinks are silently dropped:
  #   1. enabled_regions below
  #   2. INTEGRATION__MQTT__*_TOPIC_TEMPLATE prefixes in docker-compose.yml ("as923/")
  #   3. the gateway's Channel Plan (SenseCAP M2: AS923-1)
  # Enabled regions.
  enabled_regions=[
    "as923",
  ]


# API interface configuration.
[api]

  # interface:port to bind the API interface to.
  bind="0.0.0.0:8080"

  # Secret.
  secret="$CHIRPSTACK_API_SECRET"


[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="tcp://$MQTT_BROKER_HOST:1883/"
    json=true