services:
  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
      - chirpstack-data:/var/lib/chirpstack
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chirpstack}
      - CHIRPSTACK_API_SECRET=${CHIRPSTACK_API_SECRET:?Set CHIRPSTACK_API_SECRET (openssl rand -base64 32)}
      - MQTT_CHIRPSTACK_PASSWORD=${MQTT_CHIRPSTACK_PASSWORD:?Set MQTT_CHIRPSTACK_PASSWORD (openssl rand -hex 24)}
      - SERVICE_FQDN_CHIRPSTACK_8080

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__SERVERS=tcp://mosquitto:1883
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=gateway-bridge
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${MQTT_GATEWAY_BRIDGE_PASSWORD:?Set MQTT_GATEWAY_BRIDGE_PASSWORD (openssl rand -hex 24)}
      # REGION: AS923-1 ("as923/" prefix), NOT AS923-2. Must match enabled_regions
      # in configuration/chirpstack/chirpstack.toml and the gateway's Channel Plan.
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=as923/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=as923/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=as923/gateway/{{ .GatewayID }}/command/#
    depends_on:
      mosquitto:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # Authentication is required (allow_anonymous false). Users and their
    # topic permissions are in configuration/mosquitto/config/mosquitto.acl; passwords
    # come from the MQTT_*_PASSWORD env vars below (set them in Coolify).
    entrypoint: ["sh", "/mosquitto/config/mosquitto-init.sh"]
    ports:
      - "1883:1883"
    environment:
      - MQTT_CHIRPSTACK_PASSWORD=${MQTT_CHIRPSTACK_PASSWORD:?Set MQTT_CHIRPSTACK_PASSWORD (openssl rand -hex 24)}
      - MQTT_GATEWAY_BRIDGE_PASSWORD=${MQTT_GATEWAY_BRIDGE_PASSWORD:?Set MQTT_GATEWAY_BRIDGE_PASSWORD (openssl rand -hex 24)}
      - MQTT_ORION_PASSWORD=${MQTT_ORION_PASSWORD:?Set MQTT_ORION_PASSWORD (openssl rand -hex 24)}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u chirpstack -P \"$$MQTT_CHIRPSTACK_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: bind
        source: ./configuration/mosquitto/config/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        # Keep in sync with configuration/mosquitto/config/mosquitto.conf
        content: |
          listener 1883
          allow_anonymous false
          password_file /mosquitto/config/passwd
          acl_file /mosquitto/config/mosquitto.acl
          persistence true
          persistence_location /mosquitto/data/
          log_dest stdout
      - type: bind
        source: ./configuration/mosquitto/config/mosquitto.acl
        target: /mosquitto/config/mosquitto.acl
        # Keep in sync with configuration/mosquitto/config/mosquitto.acl (single $, Coolify writes content verbatim)
        content: |
          # ChirpStack network server: full access (incl. $SYS for the healthcheck).
          user chirpstack
          topic readwrite #
          topic read $SYS/#

          # Gateway bridge: only gateway topics (region AS923-1 = "as923/" prefix).
          user gateway-bridge
          topic readwrite as923/gateway/#

          # ORION Fleet Intelligence: read-only access to application uplinks/events.
          user orion
          topic read application/#
      - type: bind
        source: ./configuration/mosquitto/config/mosquitto-init.sh
        target: /mosquitto/config/mosquitto-init.sh
        # Keep in sync with configuration/mosquitto/config/mosquitto-init.sh (single $, Coolify writes content verbatim)
        content: |
          #!/bin/sh
          # Builds the Mosquitto password file from environment variables on every
          # start, then hands over to the image's normal entrypoint.
          set -e

          : "${MQTT_CHIRPSTACK_PASSWORD:?MQTT_CHIRPSTACK_PASSWORD is required}"
          : "${MQTT_GATEWAY_BRIDGE_PASSWORD:?MQTT_GATEWAY_BRIDGE_PASSWORD is required}"
          : "${MQTT_ORION_PASSWORD:?MQTT_ORION_PASSWORD is required}"

          PW=/mosquitto/config/passwd
          rm -f "$PW"
          touch "$PW"
          chmod 0700 "$PW"
          mosquitto_passwd -b "$PW" chirpstack "$MQTT_CHIRPSTACK_PASSWORD"
          mosquitto_passwd -b "$PW" gateway-bridge "$MQTT_GATEWAY_BRIDGE_PASSWORD"
          mosquitto_passwd -b "$PW" orion "$MQTT_ORION_PASSWORD"
          chown mosquitto:mosquitto "$PW"

          exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack -d chirpstack"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - type: bind
        source: ./configuration/postgresql/initdb/001-chirpstack_extensions.sh
        target: /docker-entrypoint-initdb.d/001-chirpstack_extensions.sh
        # Keep in sync with configuration/postgresql/initdb/001-chirpstack_extensions.sh
        # Note: Coolify writes content verbatim, so use a single $ (not $$).
        content: |
          #!/bin/bash
          set -e

          psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname="$POSTGRES_DB" <<-EOSQL
              create extension if not exists pg_trgm;
              create extension if not exists hstore;
          EOSQL
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chirpstack}
      - POSTGRES_DB=chirpstack

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  chirpstack-data:
  postgresql-data:
  redis-data:
  mosquitto-data:
